services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: artiko
      POSTGRES_PASSWORD: artiko
      POSTGRES_DB: artiko
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, artiko, -d, artiko]
      interval: 3s
      timeout: 3s
      start_period: 45s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://artiko:artiko@postgres:5432/artiko}
      PORT: '8000'
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${ARTIKO_PORT:-8000}}
    ports:
      - '127.0.0.1:${ARTIKO_PORT:-8000}:8000'
    volumes:
      - media-data:/app/media
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      start_period: 180s
      retries: 20

volumes:
  postgres-data:
  media-data:
