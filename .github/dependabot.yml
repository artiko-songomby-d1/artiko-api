version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The Dockerfile pins its base images by digest: without this they would never receive security updates.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
