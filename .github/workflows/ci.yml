name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --verbose .
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the tests; dev and production use Neon.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artiko
          POSTGRES_PASSWORD: artiko
          POSTGRES_DB: artiko_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artiko" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://artiko:artiko@localhost:5432/artiko_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Known-vulnerability scan of the locked, non-dev dependencies.
      - run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
  docker:
    # The image Render runs: dependencies, code and the CLIP model must all build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t artiko-api .
