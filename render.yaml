# Render Blueprint: the API as a Docker web service. Secrets are entered in the Render dashboard
# (sync: false), never committed. Free instances sleep after 15 idle minutes: open the API once
# before a demo.
services:
  - type: web
    name: artiko-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: MEDIA_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "60"
      - key: AI_DETECTION_PROVIDER
        sync: false
      - key: SIGHTENGINE_USER
        sync: false
      - key: SIGHTENGINE_SECRET
        sync: false
