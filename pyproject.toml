[project]
name = "artiko-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.9",
    "c2pa-python>=0.39.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle, pyflakes. I: imports. B: bugbear. UP: modern syntax. S: bandit security. ASYNC: blocking calls in async code. SIM/C4: simplifications.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials are normal in tests
"tests/conftest.py" = ["E402"]  # the test database URL must be set before the app is imported
"scripts/*" = ["S311", "S113"]  # demo seeding: non-crypto randomness, one-off HTTP calls
